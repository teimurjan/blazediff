packages:
  - packages/*
  # The three native families are grouped one level deeper: the wrapper package
  # and its six platform-binary packages share a folder named after the family.
  - packages/core-native/*
  - packages/ssim-native/*
  - packages/interpret-native/*
  - apps/*
  - examples/*
  # Version-only shadows for the Rust crates + Python wheel (private; crates.io/PyPI, not npm).
  #
  # @blazediff/rust → blazediff crate (crates.io)
  #                 ↘ blazediff wheel (PyPI)
  # @blazediff/rust-shared → blazediff-shared crate (crates.io)
  # @blazediff/rust-interpret → blazediff-interpret crate (crates.io)
  # @blazediff/rust-png → blazediff-png crate (crates.io)
  # @blazediff/rust-ssim → blazediff-ssim crate (crates.io)
  - crates/blazediff
  - crates/blazediff-interpret
  - crates/blazediff-shared
  - crates/blazediff-png
  - crates/blazediff-ssim

onlyBuiltDependencies:
  - esbuild
  - sharp
  - odiff-bin

ignoredOptionalDependencies:
  - "@blazediff/core-native-*"
  - "@blazediff/ssim-native-*"
  - "@blazediff/interpret-native-*"
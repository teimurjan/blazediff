name: Benchmark Object

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  benchmark-object:
    name: Object Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The checkout holds the committed results; drop them so a failed run
      # cannot upload a stale copy.
      - name: Remove committed benchmark results
        run: rm -f benchmarks/results/object.json

      - name: Run Benchmark (@blazediff/object vs microdiff)
        run: pnpm benchmark object --skip-md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-object
          path: benchmarks/results/object.json
          if-no-files-found: warn

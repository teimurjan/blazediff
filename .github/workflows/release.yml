name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".changeset/**"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Must match the environment configured on each package's npm trusted publisher
    environment: npm
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
          # Use a PAT so the Version Packages PR is opened/pushed as a
          # real user — actions performed by GITHUB_TOKEN don't trigger
          # downstream workflows (notably release-artifacts-check.yml).
          token: ${{ secrets.CHANGESETS_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          # No registry-url on purpose: it makes setup-node write an .npmrc
          # with a dummy NODE_AUTH_TOKEN, which npm prefers over the OIDC
          # token exchange and turns every publish into a 404.

      - name: Setup npm for trusted publishing
        # 11.5.1 is the floor for OIDC; npm 12 needs a newer Node than .node-version
        run: npm install --global npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose

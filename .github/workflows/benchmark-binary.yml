name: Benchmark Binary

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to benchmark on'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

jobs:
  benchmark-binary:
    name: Binary Benchmark (${{ github.event.inputs.platform }})
    runs-on: ${{ github.event.inputs.platform }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # The vendored C (libspng, libjpeg-turbo, miniz) lives in submodules,
          # and build.rs compiles it whenever the `io` feature is on. Without
          # this the native build dies on a missing vendor/libspng/spng/spng.c.
          submodules: recursive
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev
          # libjpeg-turbo assembles its x86 SIMD paths with nasm.
          if [ "$(uname -m)" = "x86_64" ]; then sudo apt-get install -y nasm; fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The committed platform binaries are release artifacts, refreshed only by
      # `Version Packages` commits, so they lag the source on any feature branch.
      # Deleting them means this job either measures a binary built from this
      # commit or fails outright. It can no longer report numbers for an older
      # release while appearing to benchmark the branch.
      - name: Remove prebuilt native artifacts
        run: rm -f packages/core-native/core-native-*/blazediff packages/core-native/core-native-*/blazediff.node

      # `--target <host triple>` compiles natively (no cross/Docker) with the
      # same per-target RUSTFLAGS the published artifacts use: `-C
      # target-cpu=haswell` on x86-64, which is what makes the AVX2 dispatch
      # path reachable. `--native` would use target-cpu=native and measure a
      # binary no user receives.
      - name: Build native binary from source
        shell: bash
        env:
          # `_targets.sh` adds -mevex512 to the x86_64 Linux C flags for zig's
          # clang; the runner's native cc is GCC 13, which has no such flag.
          BLAZEDIFF_SKIP_EVEX512: "1"
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | awk '/^host:/{print $2}')
          echo "Building for $HOST"
          ./crates/blazediff/scripts/build-all.sh --target "$HOST" --napi

      # A .node can only exist here if this job built it (the prebuilt ones were
      # deleted above), so this asserts the build actually emitted the binding.
      - name: Verify a native binary was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nodes=(packages/core-native/core-native-*/blazediff.node)
          if [ ${#nodes[@]} -eq 0 ]; then
            echo "::error::No .node produced; the benchmark would have no native binding."
            exit 1
          fi
          ls -l "${nodes[@]}"

      - name: Build
        run: pnpm build

      # Must run AFTER `pnpm build`: @blazediff/core-native's entry point is
      # dist/index.js, which tsup emits during the build. Requiring the package
      # before that fails with MODULE_NOT_FOUND even though the .node exists.
      - name: Verify the native binding loads
        shell: bash
        working-directory: apps/image-benchmark
        run: |
          set -euo pipefail
          node -e '
            const { hasNativeBinding } = require("@blazediff/core-native");
            if (!hasNativeBinding()) {
              console.error("::error::native binding not loadable; benchmark would fall back to JS");
              process.exit(1);
            }
            console.log("native binding OK");
          '

      # The checkout holds the committed results; drop them so a failed run
      # cannot upload a stale copy.
      - name: Remove committed benchmark results
        run: rm -f benchmarks/results/core-native.json benchmarks/results/honeydiff.json

      # Runs core-native, core-native-next and odiff, then writes
      # benchmarks/results/core-native.json.
      - name: Run Benchmark (@blazediff/core-native vs odiff)
        run: pnpm benchmark core-native --skip-md

      - name: Run Benchmark (@blazediff/core-native vs honeydiff)
        if: always()
        run: pnpm benchmark honeydiff --skip-md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-binary-${{ github.event.inputs.platform }}
          path: |
            benchmarks/results/core-native.json
            benchmarks/results/honeydiff.json
          if-no-files-found: warn

name: release-artifacts-check

# Merge gate on the Changesets "Version Packages" PR. Goes green only when
# every release-shipped binary matches the version recorded in
# `crates/blazediff/Cargo.toml`. Non-Changesets PRs short-circuit to success.
#
# Workflow:
#   1. Changesets opens a PR on `changeset-release/main` bumping versions.
#   2. This check goes red — artifacts are stale or missing.
#   3. Maintainer comments `/build` on the PR; build-artifacts.yml rebuilds
#      every platform on GitHub runners and pushes the artifacts to the branch.
#      (Locally that is: pnpm build:rust, build:rust:ssim, build:wasm and
#      build:python:all -- --version <NEW>, committed and pushed.)
#   4. Check turns green; PR is mergeable; merge fires release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: verify release artifacts for current version
    runs-on: ubuntu-latest
    steps:
      - name: short-circuit for non-Changesets PRs
        id: gate
        run: |
          if [[ "${{ github.head_ref }}" == changeset-release/* ]]; then
            echo "release_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_pr=false" >> "$GITHUB_OUTPUT"
            echo "Not a Changesets release PR; check is a no-op."
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.release_pr == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Need base commit for the staleness diff on binaries whose
          # filenames don't encode the version (.node, CLI, .wasm).
          fetch-depth: 0
          # We only diff LFS pointer hashes (changed pointer = changed
          # binary); pulling the actual blobs from LFS would burn
          # bandwidth on every PR sync for no information gained.
          lfs: false

      - name: verify all expected files present and fresh
        if: steps.gate.outputs.release_pr == 'true'
        run: |
          set -euo pipefail
          VER=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' crates/blazediff/Cargo.toml | head -1)
          echo "Target version: $VER"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Base SHA: $BASE_SHA"

          # Binaries and WASM only need rebuilding when the Rust crates
          # actually changed; for JS-only releases the existing artifacts
          # from the previous version are still valid. blazediff links
          # blazediff-shared and blazediff-ssim, so a change to either lands in
          # its binaries too.
          if git diff --quiet "$BASE_SHA" -- crates/blazediff/ crates/blazediff-shared/ crates/blazediff-ssim/; then
            crate_changed=false
            echo "blazediff crates unchanged since base — skipping binary/WASM freshness checks."
          else
            crate_changed=true
            echo "blazediff crates changed since base — binaries and WASM must be rebuilt."
          fi

          # The interpret .node sits above both producers, so any of them.
          if git diff --quiet "$BASE_SHA" -- crates/blazediff-interpret/ crates/blazediff/ crates/blazediff-ssim/ crates/blazediff-shared/; then
            interpret_crate_changed=false
            echo "interpret crates unchanged since base — skipping interpret .node freshness checks."
          else
            interpret_crate_changed=true
            echo "interpret crates changed since base — interpret .node files must be rebuilt."
          fi

          # The ssim .node only depends on blazediff-ssim and blazediff-shared.
          if git diff --quiet "$BASE_SHA" -- crates/blazediff-ssim/ crates/blazediff-shared/; then
            ssim_crate_changed=false
            echo "ssim crates unchanged since base — skipping ssim .node freshness checks."
          else
            ssim_crate_changed=true
            echo "ssim crates changed since base — ssim .node files must be rebuilt."
          fi

          missing=()
          stale=()

          require_file() {
            local f="$1"
            if [[ ! -f "$f" ]]; then missing+=("$f"); fi
          }

          # Files whose names don't encode version: require both presence
          # AND a diff vs. base, otherwise a leftover from the prior release
          # would silently satisfy the check.
          require_fresh_file() {
            local f="$1"
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            elif git diff --quiet "$BASE_SHA" -- "$f"; then
              stale+=("$f (unchanged since $BASE_SHA)")
            fi
          }

          # --- Python wheels (version is in filename) ----------------------
          for plat in \
              "macosx_10_12_x86_64" \
              "macosx_11_0_arm64" \
              "manylinux_2_17_aarch64.manylinux2014_aarch64" \
              "manylinux_2_17_x86_64.manylinux2014_x86_64" \
              "win_amd64" \
              "win_arm64"; do
            require_file "crates/blazediff/wheels/blazediff-${VER}-cp38-abi3-${plat}.whl"
          done

          if [[ "$crate_changed" == "true" ]]; then
            # --- NAPI .node + per-platform CLI -----------------------------
            for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
              require_fresh_file "packages/core-native-${plat}/blazediff.node"
              require_fresh_file "packages/core-native-${plat}/blazediff"
            done
            for plat in win32-arm64 win32-x64; do
              require_fresh_file "packages/core-native-${plat}/blazediff.node"
              require_fresh_file "packages/core-native-${plat}/blazediff.exe"
            done

            # --- WASM ------------------------------------------------------
            require_fresh_file "packages/core-wasm/wasm/blazediff_bg.wasm"
            require_fresh_file "packages/core-wasm/wasm/blazediff.js"
          fi

          if [[ "$ssim_crate_changed" == "true" ]]; then
            # --- SSIM NAPI .node -------------------------------------------
            for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
              require_fresh_file "packages/ssim-native-${plat}/blazediff_ssim.node"
            done
          fi

          if [[ "$interpret_crate_changed" == "true" ]]; then
            # --- Interpret NAPI .node --------------------------------------
            for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
              require_fresh_file "packages/interpret-native-${plat}/blazediff_interpret.node"
            done
          fi

          if [[ ${#missing[@]} -gt 0 || ${#stale[@]} -gt 0 ]]; then
            echo "::error::Release artifacts for v${VER} are not ready."
            if [[ ${#missing[@]} -gt 0 ]]; then
              echo "Missing:"
              for f in "${missing[@]}"; do echo "  - $f"; done
            fi
            if [[ ${#stale[@]} -gt 0 ]]; then
              echo "Stale (committed but not rebuilt for this version):"
              for f in "${stale[@]}"; do echo "  - $f"; done
            fi
            echo
            echo "Comment '/build' on this PR to rebuild them on CI and push, or"
            echo "do it locally:"
            echo "  git fetch origin && git checkout ${{ github.head_ref }}"
            echo "  pnpm build:rust"
            echo "  pnpm build:rust:ssim"
            echo "  pnpm build:rust:interpret"
            echo "  pnpm build:wasm"
            echo "  pnpm build:python:all -- --version ${VER}"
            # --no-verify: the no-binaries pre-commit hook blocks artifact
            # commits, since this is normally CI's job.
            echo "  git add -A && git commit --no-verify -m 'build: artifacts for v${VER}' && git push"
            exit 1
          fi

          echo "All expected v${VER} artifacts present and rebuilt."

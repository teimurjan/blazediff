[package]
name = "blazediff"
version = "5.4.0"
edition = "2021"
authors = ["Teimur Gasanov"]
description = "High-performance image diffing with block-based optimization and SIMD"
license = "MIT"
repository = "https://github.com/teimurjan/blazediff"
keywords = ["image", "diff", "simd", "visual-regression", "screenshot"]
categories = ["multimedia::images", "command-line-utilities"]
build = "build.rs"
readme = "README.md"
include = ["src/**/*", "build.rs", "Cargo.toml", "README.md"]

[[bin]]
name = "blazediff"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "blazediff"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[features]
default = ["io", "cli"]
# Semantic diff interpretation. Pure compute over decoded buffers, so it's
# available to both the io stack and the wasm build.
interpret = ["dep:blazediff-interpret"]
io = ["interpret", "blazediff-shared/codecs"]
cli = ["io", "dep:clap"]
napi = ["io", "dep:napi", "dep:napi-derive"]
python = ["io", "dep:pyo3"]
wasm = [
    "interpret",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
]
# Internal-only: exposes blazediff-shared's spng oracle to fuzz/.
fuzzing = ["io", "blazediff-shared/fuzzing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
napi = { version = "2", features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38", "generate-import-lib"], optional = true }
# `version` is required to publish `blazediff` to crates.io; kept in lockstep
# with these crates' versions by scripts/release/sync-cargo-version.js.
#
# blazediff-shared is not optional: `types.rs` needs `Image` unconditionally,
# including the wasm build — which is why its codecs (the vendored C) sit
# behind that crate's own feature rather than behind `dep:`, so the wasm build
# gets the types without the decoders.
blazediff-shared = { path = "../blazediff-shared", version = "5.4.0", default-features = false }
blazediff-interpret = { path = "../blazediff-interpret", version = "5.4.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen pinned to match the wasm-bindgen-cli version used in build-wasm.sh.
# Bumping requires bumping both in lockstep.
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# `testing` exposes the shared image constructors the interpret tests below use.
blazediff-interpret = { path = "../blazediff-interpret", features = ["testing"] }
criterion = { version = "0.5", features = ["html_reports"] }
png = "0.18.1"
